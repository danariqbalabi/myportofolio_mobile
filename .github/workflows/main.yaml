name: CI
on:
  push:
    branches: [main, tutorial/10-integrasi-backend]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      flutter_version: '3.47.7'
      setup: dart run build_runner build --delete-conflicting-outputs
      coverage_excludes: '**/*.g.dart'
      min_coverage: 0
      timeout_minutes: 15
  build_apk:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'http://10.0.2.2:8000' }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
